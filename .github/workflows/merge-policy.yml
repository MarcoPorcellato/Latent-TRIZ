name: Merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  POLICY_CONTEXT: merge-policy/gate

jobs:
  classify:
    name: Trusted path classification
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      docs_only: ${{ steps.policy.outputs.docs_only }}
      require_repository_check: ${{ steps.policy.outputs.require_repository_check }}
      require_python_311: ${{ steps.policy.outputs.require_python_311 }}
      require_scientific_audit: ${{ steps.policy.outputs.require_scientific_audit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Classify changed paths with trusted base code
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > changed-files.json
          PYTHONPATH=trusted/src python3 -m latent_triz.merge_policy classify --files-json changed-files.json --github-output "$GITHUB_OUTPUT"

  docs:
    name: Documentation audit
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: make docs-audit

  repository:
    name: Repository check (Python 3.12)
    needs: classify
    if: needs.classify.outputs.require_repository_check == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-schema.lock
      - run: python scripts/repository_check.py

  python-311:
    name: Repository check (Python 3.11)
    needs: classify
    if: needs.classify.outputs.require_python_311 == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-schema.lock
      - run: python scripts/repository_check.py

  scientific:
    name: Scientific artifact audit
    needs: classify
    if: needs.classify.outputs.require_scientific_audit == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Parse inert artifacts with trusted base code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > changed-files.json
          PYTHONPATH=trusted/src python3 -m latent_triz.merge_policy audit --files-json changed-files.json --repository candidate

  gate:
    name: Publish trusted aggregate
    if: always() && github.event.pull_request.draft == false
    needs: [classify, docs, repository, python-311, scientific]
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Evaluate required lanes and publish exact-head status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          REQUIRE_REPOSITORY: ${{ needs.classify.outputs.require_repository_check }}
          REQUIRE_311: ${{ needs.classify.outputs.require_python_311 }}
          REQUIRE_SCIENCE: ${{ needs.classify.outputs.require_scientific_audit }}
          DOCS: ${{ needs.docs.result }}
          REPOSITORY: ${{ needs.repository.result }}
          PYTHON311: ${{ needs.python-311.result }}
          SCIENTIFIC: ${{ needs.scientific.result }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=success
          description="Trusted hosted qualification passed"
          require_success() {
            if [[ "$1" == "true" && "$2" != "success" ]]; then state=failure; fi
          }
          [[ "$CLASSIFY" == "success" ]] || state=failure
          require_success "$DOCS_ONLY" "$DOCS"
          require_success "$REQUIRE_REPOSITORY" "$REPOSITORY"
          require_success "$REQUIRE_311" "$PYTHON311"
          require_success "$REQUIRE_SCIENCE" "$SCIENTIFIC"
          if [[ "$state" != "success" ]]; then
            description="Required hosted qualification failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context="$POLICY_CONTEXT" -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "$state" == "success" ]]
